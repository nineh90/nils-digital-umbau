; Laufzeiteinstellungen für nils-digital-web.
memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 16M
max_execution_time = 60

; Fehler ins Protokoll, nie in die Ausgabe: eine PHP-Warnung mitten in der
; Seite verrät Pfade und Paketversionen.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
