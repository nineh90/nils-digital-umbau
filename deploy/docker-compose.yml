name: nils-digital-web

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nils-digital-web:aktuell
    container_name: nils-digital-web
    restart: unless-stopped

    environment: &umgebung
      TZ: Europe/Berlin
      APP_NAME: Nils-Digital
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?APP_KEY fehlt – einmalig mit "php artisan key:generate --show" erzeugen und in deploy/.env eintragen}
      APP_URL: ${APP_URL:-https://nils-digital.de}
      APP_LOCALE: de
      APP_FALLBACK_LOCALE: en
      APP_TIMEZONE: Europe/Berlin

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-nils_digital_web}
      DB_USERNAME: ${DB_USERNAME:-nils_digital_web}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}

      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: 'true'
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: warning

      # Versand über Google Workspace. Der SPF-Eintrag der Domain autorisiert
      # ausschließlich Google – über einen anderen Server verschickte Mails
      # laufen in einen Softfail und landen im Spam.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-info@nils-digital.de}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Nils-Digital}

      # Anfragen werden Tickets. Das Ticketsystem hängt im selben Docker-Netz,
      # der Aufruf verlässt den Server also nicht. Ohne Token bleibt die
      # Übergabe aus.
      TICKETSYSTEM_URL: ${TICKETSYSTEM_URL:-http://ticketsystem}
      TICKETSYSTEM_TOKEN: ${TICKETSYSTEM_TOKEN:-}
      TICKETSYSTEM_PROJEKT: ${TICKETSYSTEM_PROJEKT:-anfragen}

    volumes:
      # Hochgeladene Bilder überleben den Neubau des Abbilds nur hier: public/
      # entsteht bei jedem Deploy neu aus dem Repository.
      - uploads:/var/www/html/public/uploads
      - storage:/var/www/html/storage

    networks:
      - n8n_default

    labels:
      - "traefik.enable=true"

      # Zwei Router an einem Container – ohne ausdrücklich benannten Dienst
      # weiss Traefik nicht, wohin der zweite zeigen soll.
      - "traefik.http.services.ndweb.loadbalancer.server.port=80"

      # --- Die Seite selbst ------------------------------------------------
      #
      # Seit dem Domain-Umzug am 3. Oktober 2026 ohne noindex. Vorher hing an
      # diesem Router ein X-Robots-Tag, der die Vorschau aus dem Suchindex
      # hielt; kommt er je zurück, ist die Seite für Google unsichtbar. Die
      # Prüfung am Ende von deploy.sh schlägt in dem Fall Alarm.
      - "traefik.http.routers.ndweb.entrypoints=web,websecure"
      - "traefik.http.routers.ndweb.rule=Host(`nils-digital.de`)"
      - "traefik.http.routers.ndweb.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.ndweb.service=ndweb"

      # --- Nebenadressen ---------------------------------------------------
      #
      # www und die frühere Vorschau leiten auf die nackte Domain. Nötig, weil
      # <x-seo> das Canonical aus der aufgerufenen Adresse baut: ohne die
      # Weiterleitung gäbe es dieselbe Seite unter drei Namen, jede mit sich
      # selbst als Original.
      #
      # neu. bleibt als Weiterleitung stehen, solange Links dorthin im Umlauf
      # sind – dafür muss auch der DNS-Eintrag bleiben.
      #
      # Doppeltes Dollarzeichen, weil Compose sonst ${1} als Variable liest.
      - "traefik.http.routers.ndweb-neben.entrypoints=web,websecure"
      - "traefik.http.routers.ndweb-neben.rule=Host(`www.nils-digital.de`) || Host(`neu.nils-digital.de`)"
      - "traefik.http.routers.ndweb-neben.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.ndweb-neben.service=ndweb"
      - "traefik.http.routers.ndweb-neben.middlewares=ndweb-hauptdomain@docker"
      - "traefik.http.middlewares.ndweb-hauptdomain.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.ndweb-hauptdomain.redirectregex.replacement=https://nils-digital.de/$${1}"
      - "traefik.http.middlewares.ndweb-hauptdomain.redirectregex.permanent=true"

  # Verschickt die Mails aus dem Kontaktformular. Ohne diesen Container bleibt
  # jede Anfrage in der Warteschlange liegen – das Formular meldet Erfolg, aber
  # es kommt nie etwas an.
  warteschlange:
    image: nils-digital-web:aktuell
    container_name: nils-digital-web-warteschlange
    restart: unless-stopped
    depends_on:
      - app
    user: www-data
    environment:
      <<: *umgebung
      ROLLE: worker
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - uploads:/var/www/html/public/uploads
      - storage:/var/www/html/storage
    networks:
      - n8n_default

volumes:
  uploads:
  storage:

networks:
  n8n_default:
    external: true
